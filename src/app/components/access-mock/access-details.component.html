<form [formGroup]="form" (ngSubmit)="onSubmit()" class="access-form">
  <div class="form-grid">

    <!-- LEFT -->
    <div class="left">
      <div class="box">
        <div class="group-title">Reuters FX Forward Status</div>
        <div class="placeholder-box"></div>
      </div>

      <div class="box" style="margin-top:16px;">
        <div class="group-title">Reuters/EBS Spot Credit Group</div>
        <div class="placeholder-box"></div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center">
      <!-- Middle triplet -->
      <div class="triplet">

        <!-- Forward (with helper text) -->
        <div class="box">
          <div class="group-title">Forward</div>

          <div class="helper-text">
            *ECN Limit for EBS Forward means National Limit*
          </div>

          <div class="field-row">
            <label>ECN Limit</label>
            <input formControlName="ecnLimit_forward" />
          </div>
          <div class="field-row">
            <label>ECN %</label>
            <input formControlName="ecnPct_forward" />
          </div>
          <div class="field-row">
            <label>MTS Limit</label>
            <input formControlName="mtsLimit_forward" />
          </div>
        </div>

        <!-- Settlement -->
        <div class="box">
          <div class="group-title">Settlement</div>

          <div class="field-row">
            <label>ECN Limit</label>
            <input formControlName="ecnLimit_settlement" />
          </div>
          <div class="field-row">
            <label>ECN %</label>
            <input formControlName="ecnPct_settlement" />
          </div>
          <div class="field-row">
            <label>MTS Limit</label>
            <input formControlName="mtsLimit_settlement" />
          </div>
        </div>

        <!-- RET Only -->
        <div class="box">
          <div class="group-title">RET Only</div>

          <div class="field-row">
            <label>Max Tenor</label>
            <input formControlName="maxTenor_ret" />
          </div>
          <div class="field-row">
            <label>Max Tenor Risk Factor</label>
            <input formControlName="riskFactor_ret" />
          </div>
          <div class="field-row">
            <label>Aggregate Limit</label>
            <input formControlName="aggLimit_ret" />
          </div>
          <div class="field-row">
            <label>RET Account Number</label>
            <input formControlName="retAcct" />
          </div>
        </div>

      </div>

      <!-- Sub-row: Currenex Only / OA Only -->
      <div class="sub-row">
        <div class="sub-box">
          <div class="sub-title">Currenex Only</div>
          <div class="field-row" style="grid-template-columns: 120px 1fr;">
            <label>ECN Cust ID</label>
            <input formControlName="currenexCustId" />
          </div>
        </div>

        <div class="sub-box">
          <div class="sub-title">OA Only</div>
          <div class="field-row" style="grid-template-columns: 120px 1fr;">
            <label>Max Tenor</label>
            <input formControlName="oaMaxTenor" />
          </div>
        </div>

        <div><!-- empty for alignment --></div>
      </div>

      <!-- EFX + Special Instructions side by side -->
      <div class="efx-special-row" style="display:flex; gap:16px; margin-top:14px;">

        <!-- EFX box -->
        <div class="efx-special-row" style="display:flex; gap:16px; margin-top:14px;">

          <!-- EFX box -->
          <div class="box efx-box" style="flex:1; display:flex; flex-direction:column;">
            <div class="group-title">EFX</div>

            <textarea formControlName="efxNotes" aria-label="EFX notes"
              style="width:100%; height:80px; resize:vertical; box-sizing:border-box;"></textarea>

            <!-- Single row below textarea -->
            <div class="efx-bottom" style="display:flex; gap:16px; margin-top:8px; align-items:center;">

              <div class="efx-field" style="flex:1; display:flex; flex-direction:column;">
                <label>FXALL Mnemonic Code</label>
                <input formControlName="fxallMnemonic" />
              </div>

              <div class="efx-field" style="flex:1; display:flex; flex-direction:column;">
                <label>BBG Deal Code</label>
                <input formControlName="bbgDealCode" />
              </div>

              <div class="efx-field et-field" style="flex:1; display:flex; align-items:center;">
                <input type="checkbox" formControlName="etForCms" id="etForCms" />
                <label for="etForCms" style="margin-left:6px; margin-bottom:0; white-space:nowrap;">
                  ET for CMS Sales Single Bank Portal (SSBP)
                </label>
              </div>

            </div>
          </div>

          <!-- Special Instructions box -->
          <div class="box special-instr" style="flex:1; display:flex; flex-direction:column;">
            <div class="group-title">Special Instructions to MCD:</div>
            <textarea formControlName="specialInstr"
              style="width:100%; height:80px; resize:vertical; box-sizing:border-box;"></textarea>
            <label class="checkbox-row" style="margin-top:8px;">
              <input type="checkbox" formControlName="skipAuthChecker" />
              Skip Authorized Checker
            </label>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-left">
      <button type="button" class="btn secondary" (click)="onComments()">Comments</button>
      <button type="button" class="btn secondary" (click)="onAttachments()">Attachments</button>
    </div>

    <div class="footer-right">
      <button type="button" class="btn danger" (click)="onReject()">Reject</button>
      <button type="button" class="btn primary" (click)="onApprove()">Approve</button>
      <button type="button" class="btn neutral" (click)="onCancel()">Cancel</button>
    </div>
  </footer>
</form>

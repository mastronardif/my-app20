<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-grid">

    <!-- LEFT -->
    <div class="left">
      <div class="box">
        <div class="group-title">Reuters FX Forward Status</div>
        <div style="height:160px; border:1px solid #e6ebef;"></div>
      </div>

      <div class="box" style="margin-top:16px;">
        <div class="group-title">Reuters/EBS Spot Credit Group</div>
        <div style="height:140px; border:1px solid #e6ebef;"></div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center">
      <!-- Queue -->
      <!-- <div class="box queue">
        <div style="display:flex; justify-content:space-between;">
          <div style="font-weight:600;">Current Items in Risk &amp; Controls Queue</div>
          <button type="button" (click)="onRefresh()">Refresh</button>
        </div>
        <div class="table-box"></div>
      </div> -->

      <!-- Middle triplet -->
      <div class="triplet" style="margin-top:14px;">

        <div class="box">
          <div class="group-title">Forward</div>

          <div class="field-row">
            <label>ECN Limit</label>
            <input formControlName="ecnLimit_forward" />
          </div>
          <div class="field-row">
            <label>ECN %</label>
            <input formControlName="ecnPct_forward" />
          </div>
          <div class="field-row">
            <label>MTS Limit</label>
            <input formControlName="mtsLimit_forward" />
          </div>
        </div>

        <div class="box">
          <div class="group-title">Settlement</div>

          <div class="field-row">
            <label>ECN Limit</label>
            <input formControlName="ecnLimit_settlement" />
          </div>
          <div class="field-row">
            <label>ECN %</label>
            <input formControlName="ecnPct_settlement" />
          </div>
          <div class="field-row">
            <label>MTS Limit</label>
            <input formControlName="mtsLimit_settlement" />
          </div>
        </div>

        <div class="box">
          <div class="group-title">RET Only</div>

          <div class="field-row">
            <label>Max Tenor</label>
            <input formControlName="maxTenor_ret" />
          </div>
          <div class="field-row">
            <label>Max Tenor Risk Factor</label>
            <input formControlName="riskFactor_ret" />
          </div>
          <div class="field-row">
            <label>Aggregate Limit</label>
            <input formControlName="aggLimit_ret" />
          </div>
          <div class="field-row">
            <label>RET Account Number</label>
            <input formControlName="retAcct" />
          </div>
        </div>
      </div>

      <!-- EFX -->
      <div class="box efx-box" style="margin-top:14px;">
        <div class="group-title">EFX</div>
        <textarea formControlName="efxNotes"></textarea>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="action-buttons">
        <button type="button" class="box">Comments</button>
        <button type="button" class="box">Attachments</button>
      </div>

      <div class="box special-instr" style="margin-top: 14px;">
        <div class="group-title">Special Instructions to MCD:</div>
        <textarea formControlName="specialInstr"></textarea>
        <label style="display:block; margin-top:8px;">
          <input type="checkbox" formControlName="skipAuthChecker" />
          Skip Authorized Checker
        </label>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-row">
      <div>
        <label>FXALL Mnemonic Code</label>
        <input formControlName="fxallMnemonic" />
      </div>

      <div>
        <label>BBG Deal Code</label>
        <input formControlName="bbgDealCode" />
      </div>

      <div style="display:flex;align-items:center;">
        <label style="margin-right:10px;">
          <input type="checkbox" formControlName="etForCms" /> ET for CMS
        </label>
        <small>Sales Single Bank Portal (SSBP)</small>
      </div>

      <div class="button-bar">
        <button type="button" class="reject" (click)="onReject()">Reject</button>
        <button type="submit" class="approve">Approve</button>
      </div>
    </div>

  </div>
</form>

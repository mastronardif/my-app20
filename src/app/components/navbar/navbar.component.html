<div *ngIf="loading">
  Loading form and grid...
</div>

<div *ngIf="!loading">

  <!-- AG Grid -->
  <div class="ag-theme-alpine" style="width: 100%; height: 400px; margin-bottom: 20px;">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="{ sortable: true, filter: true, resizable: true }"
      [animateRows]="true"
      [rowSelection]="'single'">
    </ag-grid-angular>
  </div>

  <!-- Dynamic Loan Form -->
  <app-dynamic-grid-form
    *ngIf="formSchema"
    [formSchema]="formSchema"
    [parentForm]="formGroup"
    (formSubmit)="onSubmit()">
  </app-dynamic-grid-form>

</div>
